<!doctype html>
<html lang="en-MY">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#071827" />
    <meta name="color-scheme" content="light dark" />
    <!-- Appearance bootstrap: applies the stored light/dark/system preference before the
         first paint so there is no light flash on a dark session. Keep this in sync with
         src/app/theme/ThemeContext.tsx (storage key + resolved theme contract). -->
    <script>
      (function () {
        try {
          var stored = window.localStorage.getItem('parkjom-theme');
          var preference = stored === 'light' || stored === 'dark' ? stored : 'system';
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var dark = preference === 'dark' || (preference === 'system' && prefersDark);
          var root = document.documentElement;
          root.classList.toggle('dark', dark);
          root.dataset.theme = dark ? 'dark' : 'light';
          root.style.colorScheme = dark ? 'dark' : 'light';
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', dark ? '#0b0b0d' : '#f5f5f7');
        } catch (error) {
          /* A blocked localStorage must never break rendering. */
        }
      })();
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ParkJom" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="ParkJom" />
    <meta name="description" content="Reserve trusted parking near LRT and MRT stations, then move through Kuala Lumpur with one connected ParkJom journey." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ParkJom — Park once. Move with the city." />
    <meta property="og:description" content="Reserve trusted parking near LRT and MRT stations, then walk straight into your day." />
    <meta property="og:image" content="https://united-perigee-400000.web.app/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ParkJom — Park once. Move with the city." />
    <meta name="twitter:description" content="Trusted parking near your LRT or MRT line." />
    <meta name="twitter:image" content="https://united-perigee-400000.web.app/og.png" />
    <link rel="manifest" href="/manifest.json" />
    <!-- Hero first frame: the scrubber fetches it from JS, invisible to the preload scanner.
         Must mirror pickFrameSet() in HeroScrollCanvas.jsx exactly:
           reduced motion      -> sd webp at any width (only frame 1 is ever used)
           >= 768px, motion ok -> hd avif
           <  768px, motion ok -> sm webp
         Getting this wrong downloads a frame the component never draws. -->
    <link rel="preload" as="image" href="/frames/frame_0001.webp" type="image/webp" media="(prefers-reduced-motion: reduce)" fetchpriority="high" />
    <link rel="preload" as="image" href="/frames-hd/frame_0001.avif" type="image/avif" media="(min-width: 768px) and (prefers-reduced-motion: no-preference)" fetchpriority="high" />
    <link rel="preload" as="image" href="/frames-sm/frame_0001.webp" type="image/webp" media="(max-width: 767px) and (prefers-reduced-motion: no-preference)" fetchpriority="high" />
    <link rel="icon" type="image/png" href="/branding/parkjom-logo.png" />
    <link rel="apple-touch-icon" href="/branding/parkjom-logo.png" />
    <title>ParkJom — Parking Near LRT &amp; MRT</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
